org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
# Keep using the explicit org.jetbrains.kotlin.android plugin path for now.
# AGP 9 enables built-in Kotlin by default; disabling it prevents the duplicate
# `kotlin` extension failure while this project still applies kotlin-android.
android.builtInKotlin=false
android.newDsl=false
kotlin.code.style=official
android.nonTransitiveRClass=true
android.dependency.useConstraints=false
android.r8.strictFullModeForKeepRules=false
android.uniquePackageNames=false
# Keep AGP 9 on the supported built-in Kotlin/new DSL path. Disabling either can
# prevent Kotlin sources from being compiled and cause runtime ClassNotFound crashes.
android.builtInKotlin=true
android.newDsl=true
